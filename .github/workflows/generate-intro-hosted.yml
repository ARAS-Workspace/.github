name: Generate Intro Animation (Hosted)

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'agg color theme'
        required: false
        default: 'solarized-dark'
        type: choice
        options:
          - solarized-dark
          - solarized-light
          - monokai
          - dracula
          - github-dark
          - github-light
          - nord
          - gruvbox-dark
          - gruvbox-light

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup runner dependencies
        run: |
          chmod +x .github/main/scripts/runner.sh
          sudo .github/main/scripts/runner.sh

      - name: Record animation
        run: |
          export TERM=xterm-256color
          chmod +x scripts/workspace-intro.sh

          asciinema rec \
            --cols 120 \
            --rows 24 \
            --idle-time-limit 2 \
            -c "./scripts/workspace-intro.sh" \
            recording.cast

      - name: Convert to GIF (${{ inputs.theme || 'solarized-dark' }})
        run: |
          mkdir -p assets

          docker run --rm \
            -v "$(pwd)":/data \
            agg:latest \
            --speed 1.5 \
            --fps-cap 15 \
            --theme ${{ inputs.theme || 'solarized-dark' }} \
            --last-frame-duration 3 \
            /data/recording.cast \
            /data/assets/intro.gif

      - name: Commit
        run: |
          rm -f recording.cast

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/intro.gif
          git diff --staged --quiet || git commit -m "chore: update intro animation"
          git push